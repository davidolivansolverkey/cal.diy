name: Self-host image build

# Builds the cal.diy Docker image once and publishes it to GHCR so the same
# image can be deployed to N Railway services (one per tenant) without
# recompiling the monorepo each time.
#
# Manual trigger only: the build takes ~30 min and burns Actions minutes,
# so we run it deliberately rather than on every push.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (besides latest and the commit SHA)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner for GHCR
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # NEXT_PUBLIC_WEBAPP_URL stays as the default placeholder on purpose:
          # scripts/start.sh rewrites it at container startup, which is what lets
          # one image serve any tenant domain.
          build-args: |
            MAX_OLD_SPACE_SIZE=6144
            CALCOM_TELEMETRY_DISABLED=1
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/cal.diy:latest
            ghcr.io/${{ steps.owner.outputs.name }}/cal.diy:${{ github.sha }}
            ${{ inputs.tag != '' && format('ghcr.io/{0}/cal.diy:{1}', steps.owner.outputs.name, inputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
